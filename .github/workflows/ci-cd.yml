name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test tự động
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Chạy test (Workers runtime + D1 giả lập)
        run: npm test

      - name: Kiểm tra cấu hình build Worker
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy lên Cloudflare Workers
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kiểm tra secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Cài thư viện
        run: npm ci

      - name: Tạo D1 nếu chưa có và điền database_id
        run: node scripts/ensure-d1.mjs

      - name: Cập nhật cấu trúc bảng D1 (migrations)
        run: npx wrangler d1 migrations apply mario-db --remote

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test sau deploy
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Kiểm tra $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" | grep -q '"db":true'; then
              curl -fsS "$URL/" | grep -q "MARIO" && echo "Deploy OK: $URL" && exit 0
            fi
            echo "Chưa sẵn sàng, thử lại sau 5s..."; sleep 5
          done
          echo "::error::Smoke test thất bại"; exit 1
