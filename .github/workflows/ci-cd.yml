name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test tự động
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Unit + integration test (Workers runtime + D1 giả lập)
        run: npm test

      - name: Kiểm tra cấu hình build Worker
        run: npx wrangler deploy --dry-run --outdir dist

  e2e:
    name: Test đầu-cuối trên trình duyệt (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Chạy test E2E (game thật + Worker + D1 local)
        run: npm run test:e2e

      - name: Lưu báo cáo khi test lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy lên Cloudflare Workers
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Kiểm tra secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # Cắt khoảng trắng / xuống dòng thừa khi dán secret
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if ! [[ "$ACCOUNT" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID không đúng định dạng (phải là 32 ký tự 0-9, a-f)"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Cài thư viện
        run: npm ci

      - name: Tạo D1 nếu chưa có và điền database_id
        run: node scripts/ensure-d1.mjs

      - name: Cập nhật cấu trúc bảng D1 (migrations)
        run: npx wrangler d1 migrations apply mario-db --remote

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Không tìm thấy link workers.dev (bật workers.dev subdomain trong Cloudflare)"; exit 1; fi
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🎮 Link chơi game: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test sau deploy
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Kiểm tra $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" | grep -q '"db":true'; then
              curl -fsS "$URL/" | grep -q "MARIO" && echo "Deploy OK: $URL" && exit 0
            fi
            echo "Chưa sẵn sàng, thử lại sau 5s..."; sleep 5
          done
          echo "::error::Smoke test thất bại"; exit 1
